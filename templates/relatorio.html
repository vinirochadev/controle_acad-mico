{% extends "base.html" %}
{% block title %}Relatório{% endblock %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">
            <i class="bi bi-bar-chart"></i> Média de Notas por Disciplina
        </h5>
    </div>

    <div class="card-body">
        <canvas id="graficoMedias" style="max-height: 380px;"></canvas>
    </div>
</div>

<!-- Script do Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const ctx = document.getElementById("graficoMedias");

    new Chart(ctx, {
        type: "bar",
        data: {
            labels: {{ labels|tojson }},
            datasets: [{
                label: "Média das Notas",
                data: {{ medias|tojson }},
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,

            scales: {
                y: {
                    beginAtZero: true,
                    max: 10
                }
            }
        }
    });
});
</script>

{% endblock %}
