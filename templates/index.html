{% extends "base.html" %}
{% block title %}Início{% endblock %}

{% block content %}

<h3 class="mb-4"><i class="bi bi-speedometer2"></i> Painel Geral</h3>

<div class="row g-4">

    <!-- Card Alunos -->
    <div class="col-md-4">
        <a href="{{ url_for('alunos') }}" class="text-decoration-none">
            <div class="dashboard-card p-4 text-center shadow-sm bg-white">
                <i class="bi bi-people-fill text-primary" style="font-size: 3rem;"></i>
                <h4 class="mt-3 text-dark">{{ total_alunos }}</h4>
                <p class="text-muted mb-0">Alunos cadastrados</p>
            </div>
        </a>
    </div>

    <!-- Card Disciplinas -->
    <div class="col-md-4">
        <a href="{{ url_for('disciplinas') }}" class="text-decoration-none">
            <div class="dashboard-card p-4 text-center shadow-sm bg-white">
                <i class="bi bi-journal-bookmark-fill text-success" style="font-size: 3rem;"></i>
                <h4 class="mt-3 text-dark">{{ total_disciplinas }}</h4>
                <p class="text-muted mb-0">Disciplinas cadastradas</p>
            </div>
        </a>
    </div>

    <!-- Card Notas -->
    <div class="col-md-4">
        <a href="{{ url_for('notas') }}" class="text-decoration-none">
            <div class="dashboard-card p-4 text-center shadow-sm bg-white">
                <i class="bi bi-pencil-square text-warning" style="font-size: 3rem;"></i>
                <h4 class="mt-3 text-dark">{{ total_notas }}</h4>
                <p class="text-muted mb-0">Notas registradas</p>
            </div>
        </a>
    </div>

</div>

{% endblock %}
